name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: "~> v2"
          args: check

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: package-checker-linux-amd64
            build_flags: -buildmode=pie
            ldflags: -bindnow
          - goos: linux
            goarch: arm64
            output: package-checker-linux-arm64
            build_flags: -buildmode=pie
            ldflags: -bindnow
          - goos: darwin
            goarch: amd64
            output: package-checker-darwin-amd64
            build_flags: ""
            ldflags: ""
          - goos: darwin
            goarch: arm64
            output: package-checker-darwin-arm64
            build_flags: ""
            ldflags: ""
          - goos: windows
            goarch: amd64
            output: package-checker-windows-amd64.exe
            build_flags: ""
            ldflags: ""
          - goos: windows
            goarch: arm64
            output: package-checker-windows-arm64.exe
            build_flags: ""
            ldflags: ""
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Cross-compile target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ${{ matrix.build_flags }} -ldflags "${{ matrix.ldflags }}" -o "${{ runner.temp }}/${{ matrix.output }}" .
