name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: check

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: package-checker-linux-amd64
            build_flags: -buildmode=pie
            ldflags: -bindnow
          - goos: linux
            goarch: arm64
            output: package-checker-linux-arm64
            build_flags: -buildmode=pie
            ldflags: -bindnow
          - goos: darwin
            goarch: amd64
            output: package-checker-darwin-amd64
            build_flags: ""
            ldflags: ""
          - goos: darwin
            goarch: arm64
            output: package-checker-darwin-arm64
            build_flags: ""
            ldflags: ""
          - goos: windows
            goarch: amd64
            output: package-checker-windows-amd64.exe
            build_flags: ""
            ldflags: ""
          - goos: windows
            goarch: arm64
            output: package-checker-windows-arm64.exe
            build_flags: ""
            ldflags: ""
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Cross-compile target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ${{ matrix.build_flags }} -ldflags "${{ matrix.ldflags }}" -o "${{ runner.temp }}/${{ matrix.output }}" .
